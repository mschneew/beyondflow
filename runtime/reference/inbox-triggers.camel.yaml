- route:
    id: inbox-triggers
    description: "REFERENZ (deaktiviert seit 0.26): frueherer HTTP-Anstoss aus der Ereignis-Laufzeit, ersetzt durch Kafka sf.opportunity"
    from:
      uri: "platform-http:/trigger/sf-opp-sync"
      parameters:
        httpMethodRestrict: POST
      steps:
        - setBody:
            constant: ""
        - to:
            uri: seda:sf-opp-sync
            parameters:
              waitForTaskToComplete: Never
        - setHeader:
            name: CamelHttpResponseCode
            constant: 202
        - setBody:
            constant: "Abgleich angestossen"
