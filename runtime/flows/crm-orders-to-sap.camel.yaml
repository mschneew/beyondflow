- route:
    id: crm-orders-to-sap
    description: "BeyondCRM Auftrags-Outbox -> Kafka crm.order (Relay, alle 5 s). Die Outbox bleibt die Quelle der Wahrheit: nicht weitergegebene Eintraege holt claim_next nach 10 Min. erneut."
    from:
      uri: timer:crm-orders-to-sap
      parameters:
        period: "5000"
        delay: "20000"
      steps:
        - to:
            uri: "sql-stored:siebel.cx_bf_sap.next_order(OUT VARCHAR orderJson)"
            parameters:
              dataSource: "#crmdb"
        - setBody:
            simple: "${body[orderJson]}"
        - filter:
            simple: "${body} != null"
            steps:
              - setHeader:
                  name: bfKey
                  jq:
                    expression: '.orderNum // .outboxId'
                    resultType: java.lang.String
              - removeHeaders:
                  pattern: "*"
                  excludePattern: bfKey
              - setHeader:
                  name: CamelKafkaKey
                  simple: "${header.bfKey}"
              - removeHeader:
                  name: bfKey
              - to:
                  uri: kafka:crm.order
                  parameters:
                    brokers: "{{bf.kafka.brokers}}"
              - log:
                  message: "Auftrag ${header.CamelKafkaKey} -> Kafka crm.order"
