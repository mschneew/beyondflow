- route:
    id: snow-contacts-to-crm
    description: "Abgleich ServiceNow customer_contact -> Kafka snow.events (stuendlich; Echtzeit kommt ueber snow-events-in)"
    from:
      uri: timer:snow-contacts
      parameters:
        period: "3600000"
        includeMetadata: "true"
        delay: "45000"
      steps:
        - choice:
            description: "Erster Lauf nach dem Start: Vollabgleich der letzten 50; danach stuendlich die in den letzten 65 Min. geaenderten (Absicherung, falls ein Ereignis fehlt)"
            when:
              - simple: "${header.CamelTimerCounter} == 1"
                steps:
                  - to:
                      uri: kamelet:servicenow-query
                      parameters:
                        table: customer_contact
                        fields: sys_id,first_name,last_name,title,email,phone,mobile_phone,account,active
            otherwise:
              steps:
                - to:
                    uri: kamelet:servicenow-query
                    parameters:
                      table: customer_contact
                      fields: sys_id,first_name,last_name,title,email,phone,mobile_phone,account,active
                      query: "sys_updated_onRELATIVEGE@minute@ago@65^ORDERBYDESCsys_updated_on"
        - split:
            jq:
              expression: .result
            steps:
              - setHeader:
                  name: bfKey
                  jq:
                    expression: .sys_id
                    resultType: java.lang.String
              - setBody:
                  description: "Als Ereignis mit mitgeliefertem Datensatz ins Topic (Verarbeitung: snow-events-to-crm)"
                  jq:
                    expression: '{table: "customer_contact", sys_id: .sys_id, operation: "abgleich", source: "abgleich", record: .}'
              - marshal:
                  json:
                    library: Jackson
              - convertBodyTo:
                  type: java.lang.String
              - removeHeaders:
                  pattern: "*"
                  excludePattern: bfKey
              - setHeader:
                  name: CamelKafkaKey
                  simple: "${header.bfKey}"
              - removeHeader:
                  name: bfKey
              - to:
                  uri: kafka:snow.events
                  parameters:
                    brokers: "{{bf.kafka.brokers}}"
