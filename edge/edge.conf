# BeyondFlow – oeffentlicher Ereignis-Eingang. Von aussen erreichbar ist NUR:
#   https://<oeffentliche IP>/ingest/servicenow   (POST, signiert, max. 16 KB)
#   http://<oeffentliche IP>/.well-known/acme-challenge/...   (Zertifikatspruefung Let's Encrypt)
# Studio, API und Laufzeit bleiben nur lokal (SSH-Tunnel).
# Die Firewall der VM leitet 443 -> 8443 und 80 -> 8089 weiter (install.sh).
limit_req_zone $binary_remote_addr zone=bfingest:1m rate=20r/s;
server_tokens off;

server {
    listen 8089 default_server;
    location /.well-known/acme-challenge/ { root /srv/acme; default_type text/plain; }
    location / { return 404; }
}

server {
    listen 8443 ssl default_server;
    ssl_certificate     /etc/bf-certs/fullchain.pem;
    ssl_certificate_key /etc/bf-certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 16k;
    access_log /dev/stdout;

    location = /ingest/servicenow {
        limit_except POST { deny all; }
        limit_req zone=bfingest burst=100 nodelay;
        proxy_pass http://127.0.0.1:8090/api/ingest/servicenow;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
    location / { return 404; }
}
