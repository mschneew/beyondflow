server {
    listen 127.0.0.1:8080;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 4m;

    location = /studio.html { root /srv/studio; add_header Cache-Control "no-store"; }
    location /licenses/ { root /srv/studio; default_type text/plain; charset utf-8; }
    location /camel-catalog/ { add_header Cache-Control "no-cache"; }
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_read_timeout 120s;
    }
}
